services:
  backend:
    build:
      context: .
      dockerfile: ChatMEDICAL.Api/Dockerfile
    container_name: chatmedical-backend
    ports:
      - "5088:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/medical_chat.db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=chatmedical-api
    volumes:
      - db-data:/app/data
    networks:
      - chatmedical-network

  frontend:
    build:
      context: ./ChatMEDICAL/chatmedical-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5088
    container_name: chatmedical-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chatmedical-network

volumes:
  db-data:

networks:
  chatmedical-network:
    driver: bridge
