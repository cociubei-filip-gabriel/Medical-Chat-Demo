services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1.8-alpine
    container_name: signoz-clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    environment:
      CLICKHOUSE_DB: signoz_metrics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - chatmedical-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:0.111.24
    container_name: signoz-telemetrystore-migrator
    entrypoint: ["sh", "-c"]
    command:
      - |
        /signoz-otel-collector migrate bootstrap && \
        /signoz-otel-collector migrate sync up && \
        /signoz-otel-collector migrate async up
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
    networks:
      - chatmedical-network

  otel-collector:
    image: signoz/signoz-otel-collector:0.111.24
    container_name: signoz-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml", "--feature-gates=-pkg.translator.prometheus.NormalizeName"]
    volumes:
      - ./signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - chatmedical-network

  signoz:
    image: signoz/signoz:latest
    container_name: signoz-backend
    command: [
      "--config=/signoz.yaml"
    ]
    volumes:
      - ./signoz/signoz.yaml:/signoz.yaml
    ports:
      - "3301:3301"  # SigNoz UI
      - "8080:8080"  # API
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
    networks:
      - chatmedical-network

volumes:
  clickhouse-data:
  clickhouse-logs:

networks:
  chatmedical-network:
    external: true
    name: chatmedical-network
