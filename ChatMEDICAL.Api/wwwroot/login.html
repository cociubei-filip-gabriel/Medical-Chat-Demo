<!DOCTYPE html>

<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/login.css">

    <!-- ICONS -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <button class="back-btn"
            onclick="window.location.href='index.html'">

        <i class="fa-solid fa-arrow-left"></i>

        <span>Înapoi</span>

    </button>

    <!-- BACKGROUND -->

    <div class="background-overlay"></div>

    <!-- LOGIN CARD -->

    <div class="login-container">

        <!-- LOGO -->

        <div class="login-logo">

            <div class="logo-icon">

                <i class="fa-solid fa-comment-medical"></i>

            </div>

            <h2>

                Chat<span>Medical</span>

            </h2>

        </div>

        <!-- TITLE -->

        <h1>

            Bine ai revenit 👋

        </h1>

        <p>

            Conectează-te pentru a continua

        </p>

        <!-- FORM -->

        <form id="loginForm">

            <!-- EMAIL -->

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input type="email"
                       id="email"
                       placeholder="Email">

            </div>

            <!-- PASSWORD -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       id="password"
                       placeholder="Parolă">

            </div>

            <!-- BUTTON -->

            <button type="submit"
                    class="login-btn">

                Login

            </button>

        </form>

        <!-- REGISTER -->

        <div class="bottom-text">

            Nu ai cont?

            <a href="register.html">

                Register

            </a>

        </div>

    </div>

    <!-- JS -->

    <script src="js/login.js"></script>

</body>

</html>
