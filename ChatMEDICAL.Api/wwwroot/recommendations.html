<!DOCTYPE html>

<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recomandări</title>

    <link rel="stylesheet"
          href="css/recommendations.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <main class="recommendations-page">

        <!-- TITLE -->

        <div class="page-header">

            <h1>

                Recomandări medicale 💊

            </h1>

            <p>

                Oferă recomandări și tratamente pacienților.

            </p>

        </div>

        <!-- GRID -->

        <div class="recommendations-grid">

            <!-- CARD -->

            <div class="recommendation-card">

                <i class="fa-solid fa-heart-pulse"></i>

                <h3>

                    Tratament cardiac

                </h3>

                <textarea placeholder="Scrie recomandarea medicală..."></textarea>

                <button>

                    Salvează

                </button>

            </div>

            <!-- CARD -->

            <div class="recommendation-card">

                <i class="fa-solid fa-pills"></i>

                <h3>

                    Medicamente

                </h3>

                <textarea placeholder="Scrie tratamentul recomandat..."></textarea>

                <button>

                    Salvează

                </button>

            </div>

            <!-- CARD -->

            <div class="recommendation-card">

                <i class="fa-solid fa-notes-medical"></i>

                <h3>

                    Observații

                </h3>

                <textarea placeholder="Adaugă observații..."></textarea>

                <button>

                    Salvează

                </button>

            </div>

        </div>

    </main>
    <script src="js/recommendations.js"></script>
</body>

</html>
