<!DOCTYPE html>

<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Doctori</title>

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/doctors.css">

    <!-- ICONS -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <!-- LOGO -->

        <div class="sidebar-logo">

            <div class="logo-icon">

                <i class="fa-solid fa-plus"></i>

            </div>

            <h2>

                Chat<span>Medical</span>

            </h2>

        </div>


        <!-- LINKS -->

        <div class="sidebar-links"
             id="sideLinks">
        </div>

    </aside>

    <!-- MAIN -->

    <main class="main-content">

        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h1>

                    Doctorii noștri 👨‍⚕️

                </h1>

                <p>

                    Alege specialistul potrivit pentru tine

                </p>

            </div>

            <button class="home-btn"
                    onclick="window.location.href='index.html'">

                <i class="fa-solid fa-house"></i>

                Acasă

            </button>

        </div>

        <!-- FILTERS -->

        <div class="filters">

            <select id="specialityFilter">

                <option value="">

                    Specializare

                </option>

                <option>

                    Cardiologie

                </option>

                <option>

                    Dermatologie

                </option>

                <option>

                    Neurologie

                </option>

            </select>

            <select id="ratingFilter">

                <option value="">

                    Rating

                </option>

                <option>

                    5 stele

                </option>

                <option>

                    4+ stele

                </option>

            </select>

        </div>

        <!-- GRID -->

        <div class="doctors-grid">

            <!-- DOCTOR 1 -->

            <div class="doctor-card"
                 data-name="Maria Ionescu"
                 data-speciality="dermatologie">

                <div class="doctor-top">

                    <img src="https://cdn-icons-png.flaticon.com/512/3304/3304567.png"
                         alt="doctor">

                    <div>

                        <h3>

                            Dr. Maria Ionescu

                        </h3>

                        <p>

                            Dermatologie

                        </p>

                    </div>

                </div>

                <div class="doctor-info">

                    <span>

                        <i class="fa-solid fa-star"></i>

                        Rating 4.8

                    </span>

                    <span>

                        <i class="fa-solid fa-briefcase"></i>

                        8 ani experiență

                    </span>

                    <span>

                        <i class="fa-solid fa-certificate"></i>

                        Membru EADV

                    </span>

                </div>

                <div class="doctor-buttons">

                    <button class="profile-btn">

                        Vezi profil

                    </button>

                    <button class="appointment-btn">

                        Programează-te

                    </button>

                </div>

            </div>

            <!-- DOCTOR 2 -->

            <div class="doctor-card"
                 data-name="Andrei Popescu"
                 data-speciality="cardiologie">

                <div class="doctor-top">

                    <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png"
                         alt="doctor">

                    <div>

                        <h3>

                            Dr. Andrei Popescu

                        </h3>

                        <p>

                            Cardiologie

                        </p>

                    </div>

                </div>

                <div class="doctor-info">

                    <span>

                        <i class="fa-solid fa-star"></i>

                        Rating 4.9

                    </span>

                    <span>

                        <i class="fa-solid fa-briefcase"></i>

                        10 ani experiență

                    </span>

                    <span>

                        <i class="fa-solid fa-certificate"></i>

                        Membru ESC

                    </span>

                </div>

                <div class="doctor-buttons">

                    <button class="profile-btn">

                        Vezi profil

                    </button>

                    <button class="appointment-btn">

                        Programează-te

                    </button>

                </div>

            </div>

        </div>

    </main>

    <!-- JS -->

    <script type="module"
            src="js/sidebar.js">
    </script>

    <script src="js/doctors.js"></script>

</body>

</html>
