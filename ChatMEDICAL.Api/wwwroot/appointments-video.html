<!DOCTYPE html>

<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        Programare Video

    </title>

    <link rel="stylesheet"
          href="appointments-video.css">

</head>

<body>

    <div class="video-appointment-page">

        <h1>

            Programare Consultație Video 👨‍⚕️

        </h1>

        <p>

            Alege data și ora consultației online

        </p>

        <!-- DATE -->

        <div class="form-group">

            <label>

                Data consultației

            </label>

            <input type="date"
                   id="appointmentDate">

        </div>

        <!-- TIME -->

        <div class="form-group">

            <label>

                Ora consultației

            </label>

            <input type="time"
                   id="appointmentTime">

        </div>

        <!-- BUTTON -->

        <button id="saveAppointmentBtn"
                class="video-btn">

            Salvează Programarea

        </button>

        <!-- SUCCESS -->

        <div class="success-box"
             id="successBox">

            Programarea video a fost salvată ✅

        </div>

        <!-- BACK -->

        <button id="backBtn"
                class="video-btn back-btn">

            ← Înapoi

        </button>

    </div>

    <script type="module"
            src="appointments-video.js">

    </script>

</body>

</html>
