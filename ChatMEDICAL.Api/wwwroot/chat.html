<!DOCTYPE html>

<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chat Medical</title>

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/chat.css">
    <link rel="stylesheet"
          href="css/theme.css">

    <!-- THEME INITIALIZER -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme") || 
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>

    <!-- ICONS -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="chat-sidebar">

        <!-- TOP -->

        <div class="sidebar-top">

            <h2>

                ChatMedical 💙

            </h2>

        </div>

        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text"
                   placeholder="Caută conversație...">

        </div>

        <!-- USERS -->

        <div class="chat-users">

            <!-- USER -->

            <div class="chat-user active-user">

                <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png"
                     alt="doctor">

                <div>

                    <h3 id="chatNameSidebar">
                    </h3>

                    <p id="chatStatusSidebar">

                        Online

                    </p>

                </div>

            </div>

        </div>

    </aside>

    <!-- MAIN -->

    <main class="chat-main">

        <!-- TOPBAR -->

        <div class="chat-topbar">

            <button class="back-btn"
                    onclick="window.history.back()">

                <i class="fa-solid fa-arrow-left"></i>

            </button>

            <div id="userStatus" class="user-status"></div>

            <div class="chat-user-info">

                <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png"
                     alt="doctor">

                <div>
                    <h3 id="chatNameTop">
                    </h3>

                    <p id="chatStatusTop">

                        activ acum

                    </p>

                </div>

            </div>

        </div>

        <!-- CHAT -->

        <div class="chat-box"
             id="chatBox">

        </div>

        <!-- INPUT -->

        <form class="chat-input"
              id="chatForm">

            <!-- EMOJI -->

            <button type="button"
                    class="chat-icon-btn"
                    id="emojiBtn">

                <i class="fa-regular fa-face-smile"></i>

            </button>

            <!-- ATTACH -->

            <button type="button"
                    class="chat-icon-btn"
                    id="attachBtn">

                <i class="fa-solid fa-paperclip"></i>

            </button>

            <!-- HIDDEN FILE INPUT -->

            <input type="file"
                   id="fileInput"
                   hidden>

            <!-- IMAGE -->

            <button type="button"
                    class="chat-icon-btn"
                    id="imageBtn">

                <i class="fa-solid fa-image"></i>

            </button>

            <!-- HIDDEN IMAGE INPUT -->

            <input type="file"
                   id="imageInput"
                   accept="image/*"
                   hidden>

            <!-- AUDIO -->

            <button type="button"
                    class="chat-icon-btn"
                    id="audioBtn">

                <i class="fa-solid fa-microphone"></i>

            </button>

            <!-- INPUT -->

            <input type="text"
                   id="messageInput"
                   placeholder="Scrie un mesaj...">

            <!-- SEND -->

            <button type="submit"
                    id="sendBtn">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </form>

    </main>

    <!-- JS -->

    <script type="module"
            src="js/chat.js">

    </script>

</body>

</html>
